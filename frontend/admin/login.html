<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Login - Jhaz 1 Way Taxi</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background-color: #0F172A; min-height: 100vh; display: flex; align-items: center; justify-content: center;">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <span class="brand-badge fs-2 mb-2 d-inline-block">JH</span>
                        <h4 class="fw-bold text-dark">Jhaz 1 Way Taxi Admin</h4>
                        <p class="text-muted small">Central Dispatch & Operations Console</p>
                    </div>

                    <div class="alert alert-warning py-2 small border-0 mb-3 text-center">
                        <i class="bi bi-shield-exclamation me-1"></i> <strong>Restricted Access:</strong> Authorized Admin Personnel Only.
                    </div>

                    <form onsubmit="handleAdminLogin(event)">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-uppercase">Admin Identifier</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-shield-lock"></i></span>
                                <input type="text" name="email" class="form-control" placeholder="Admin username or email" required autofocus>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-uppercase">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="Admin password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-dark w-100 py-2 fw-bold fs-6 mb-3">
                            Access Admin Console
                        </button>
                    </form>

                    <div class="text-center small mt-4">
                        <a href="/index.html" class="text-muted text-decoration-none">&larr; Back to Public Website</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
