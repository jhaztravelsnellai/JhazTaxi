<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Management - Jhaz 1 Way Taxi Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-sidebar-header d-flex align-items-center gap-2">
                <span class="brand-badge">JH</span>
                <span class="fs-5 fw-bold text-white">Jhaz 1 Way Taxi Admin</span>
            </div>
            <nav class="admin-nav">
                <a href="/admin/dashboard.html" class="admin-nav-item"><i class="bi bi-speedometer2"></i> Dashboard</a>
                <a href="/admin/bookings.html" class="admin-nav-item"><i class="bi bi-journal-text"></i> Customer Bookings</a>
                <a href="/admin/vehicles.html" class="admin-nav-item active"><i class="bi bi-car-front"></i> Vehicles Fleet</a>
                <a href="/admin/fares.html" class="admin-nav-item"><i class="bi bi-qr-code-scan"></i> Fare & QR Settings</a>
                <a href="/admin/payments.html" class="admin-nav-item"><i class="bi bi-credit-card"></i> Payments</a>
                <hr class="border-secondary my-3">
                <a href="/index.html" class="admin-nav-item" target="_blank"><i class="bi bi-box-arrow-up-right"></i> Customer Site</a>
                <a href="javascript:void(0)" onclick="handleGlobalLogout()" class="admin-nav-item text-danger"><i class="bi bi-box-arrow-right"></i> Sign Out</a>
            </nav>
        </aside>

        <main class="admin-main">
            <header class="admin-topbar">
                <h5 class="mb-0 fw-bold">Vehicle Fleet Management</h5>
                <button class="btn btn-yellow btn-sm fw-bold" data-bs-toggle="modal" data-bs-target="#addVehicleModal">
                    <i class="bi bi-plus-circle me-1"></i> Add Vehicle
                </button>
            </header>

            <div class="admin-content-area">
                <div class="admin-table-card">
                    <div class="admin-table-header">
                        <h6 class="fw-bold mb-0">Active Vehicles (Mini, Sedan, SUV, Premium)</h6>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-jhaz align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Photo</th>
                                    <th>Model & Name</th>
                                    <th>Type</th>
                                    <th>Plate Number</th>
                                    <th>Capacity</th>
                                    <th>Base Fare</th>
                                    <th>Price / KM</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="admin-vehicles-tbody">
                                <tr><td colspan="8" class="text-center py-4"><span class="spinner-border spinner-yellow"></span></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal: Add Vehicle -->
    <div class="modal fade" id="addVehicleModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-bottom bg-light">
                    <h5 class="modal-title fw-bold"><i class="bi bi-car-front text-warning me-2"></i>Add Vehicle to Fleet</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="add-vehicle-form" onsubmit="handleAddVehicle(event)" enctype="multipart/form-data">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-uppercase">Vehicle Name & Brand</label>
                            <input type="text" name="name" class="form-control" placeholder="e.g. Maruti Suzuki Dzire" required>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-sm-6">
                                <label class="form-label small fw-bold text-uppercase">Category</label>
                                <select name="vehicle_type" class="form-select" required>
                                    <option value="Mini">Mini</option>
                                    <option value="Sedan" selected>Sedan</option>
                                    <option value="SUV">SUV</option>
                                    <option value="Premium">Premium</option>
                                </select>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label small fw-bold text-uppercase">Plate Registration No.</label>
                                <input type="text" name="vehicle_number" class="form-control" placeholder="KA-05-AB-9999" required>
                            </div>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-sm-4">
                                <label class="form-label small fw-bold text-uppercase">Model Year</label>
                                <input type="text" name="model" class="form-control" placeholder="2024" required>
                            </div>
                            <div class="col-sm-4">
                                <label class="form-label small fw-bold text-uppercase">Capacity</label>
                                <input type="number" name="capacity" class="form-control" value="4" min="1" max="10" required>
                            </div>
                            <div class="col-sm-4">
                                <label class="form-label small fw-bold text-uppercase">Base Fare (₹)</label>
                                <input type="number" name="base_fare" class="form-control" value="100" step="5" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-uppercase">Price Per KM (₹)</label>
                            <input type="number" name="price_per_km" class="form-control" value="15" step="1" required>
                        </div>

                        <!-- Image File Upload Input with Live Preview -->
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-uppercase"><i class="bi bi-upload me-1 text-warning"></i> Upload Vehicle Photo</label>
                            <input type="file" name="image" id="vehicle-image-file" class="form-control" accept="image/*" onchange="previewVehicleUpload(this)">
                            <div id="image-preview-wrapper" class="mt-2 d-none">
                                <img id="image-preview-elem" src="" alt="Vehicle Preview" class="rounded border shadow-sm" style="max-height: 120px; width: 100%; object-fit: cover;">
                            </div>
                        </div>

                        <!-- Alternative Image URL -->
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-uppercase">Or External Image URL (Optional)</label>
                            <input type="url" name="image_url" id="vehicle-image-url" class="form-control" placeholder="https://images.unsplash.com/...">
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold text-uppercase">Description</label>
                            <textarea name="description" class="form-control" rows="2" placeholder="Vehicle features, comfort details..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-top bg-light">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" id="btn-save-vehicle" class="btn btn-yellow fw-bold">Add Vehicle</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadAdminVehicles();
        });

        function previewVehicleUpload(input) {
            const previewWrapper = document.getElementById('image-preview-wrapper');
            const previewImg = document.getElementById('image-preview-elem');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    previewWrapper.classList.remove('d-none');
                }
                reader.readAsDataURL(input.files[0]);
            } else {
                previewWrapper.classList.add('d-none');
            }
        }
    </script>
</body>
</html>
