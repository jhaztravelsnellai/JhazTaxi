<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Reviews - Jhaz 1 Way Taxi Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-sidebar-header d-flex align-items-center gap-2">
                <span class="brand-badge">JH</span>
                <span class="fs-5 fw-bold text-white">Jhaz 1 Way Taxi Admin</span>
            </div>
            <nav class="admin-nav">
                <a href="/admin/dashboard.html" class="admin-nav-item"><i class="bi bi-speedometer2"></i> Dashboard</a>
                <a href="/admin/bookings.html" class="admin-nav-item"><i class="bi bi-journal-text"></i> Bookings</a>
                <a href="/admin/drivers.html" class="admin-nav-item"><i class="bi bi-person-badge"></i> Drivers</a>
                <a href="/admin/vehicles.html" class="admin-nav-item"><i class="bi bi-car-front"></i> Vehicles</a>
                <a href="/admin/customers.html" class="admin-nav-item"><i class="bi bi-people"></i> Customers</a>
                <a href="/admin/fares.html" class="admin-nav-item"><i class="bi bi-currency-rupee"></i> Fare Settings</a>
                <a href="/admin/map.html" class="admin-nav-item"><i class="bi bi-map"></i> Dispatch Map</a>
                <a href="/admin/payments.html" class="admin-nav-item"><i class="bi bi-credit-card"></i> Payments</a>
                <a href="/admin/reviews.html" class="admin-nav-item active"><i class="bi bi-star"></i> Reviews</a>
                <a href="/admin/reports.html" class="admin-nav-item"><i class="bi bi-bar-chart-line"></i> Reports</a>
                <hr class="border-secondary my-3">
                <a href="/index.html" class="admin-nav-item" target="_blank"><i class="bi bi-box-arrow-up-right"></i> Customer Site</a>
                <a href="javascript:void(0)" onclick="handleGlobalLogout()" class="admin-nav-item text-danger"><i class="bi bi-box-arrow-right"></i> Sign Out</a>
            </nav>
        </aside>

        <main class="admin-main">
            <header class="admin-topbar">
                <h5 class="mb-0 fw-bold">Customer Ratings & Reviews</h5>
            </header>

            <div class="admin-content-area">
                <div class="admin-table-card">
                    <div class="admin-table-header">
                        <h6 class="fw-bold mb-0">Driver Feedback and Service Ratings</h6>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-jhaz align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Booking ID</th>
                                    <th>Customer</th>
                                    <th>Driver</th>
                                    <th>Rating</th>
                                    <th>Feedback / Comment</th>
                                    <th>Date</th>
                                </tr>
                            </thead>
                            <tbody id="admin-reviews-tbody">
                                <tr><td colspan="6" class="text-center py-4"><span class="spinner-border spinner-yellow"></span></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            requireAdmin();
            const tbody = document.getElementById('admin-reviews-tbody');
            const res = await fetchWithAuth(`${CONFIG.API_BASE_URL}/reviews/`);
            if (res.ok && res.data.reviews) {
                const reviews = res.data.reviews;
                if (reviews.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No reviews submitted yet.</td></tr>';
                    return;
                }
                tbody.innerHTML = reviews.map(r => `
                    <tr>
                        <td><strong>${r.booking_id_str}</strong></td>
                        <td>${r.customer_name}</td>
                        <td><strong>${r.driver_name}</strong></td>
                        <td><span class="text-warning fw-bold">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span> (${r.rating}/5)</td>
                        <td>${r.comment || '<span class="text-muted italic">No text comment provided</span>'}</td>
                        <td>${new Date(r.created_at).toLocaleDateString()}</td>
                    </tr>
                `).join('');
            }
        });
    </script>
</body>
</html>
