<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Sign In - JhazTaxi</title>
    <meta name="description" content="Sign in to your JhazTaxi customer account to book rides, track cabs, and manage your journeys.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://jhaztaxi.com/login.html">
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
    <meta name="theme-color" content="#FFC107">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/config.js"></script>
    <script>
        // If already logged in, immediately redirect to appropriate portal
        (function() {
            const token = getAuthToken();
            const user = getCurrentUser();
            if (token && user) {
                const params = new URLSearchParams(window.location.search);
                const nextUrl = params.get('next');
                if (nextUrl && nextUrl !== '/login.html') {
                    window.location.replace(nextUrl);
                } else if (user.role === 'admin') {
                    window.location.replace('/admin/dashboard.html');
                } else if (user.role === 'driver') {
                    window.location.replace('/driver/dashboard.html');
                } else {
                    window.location.replace('/index.html');
                }
            }
        })();
    </script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark navbar-jhaz">
        <div class="container">
            <a class="navbar-brand navbar-brand-jhaz" href="/index.html">
                <span class="brand-badge">JH</span>
                <span>JhazTaxi</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="/driver/login.html" class="btn btn-outline-warning btn-sm">
                    <i class="bi bi-car-front-fill me-1"></i> Driver Partner Portal
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <span class="brand-badge fs-2 mb-2 d-inline-block">JH</span>
                        <h1 class="h3 fw-bold mb-1">Customer Sign In</h1>
                        <p class="text-muted small">Sign in to book rides, track cabs, and manage your journeys</p>
                    </div>

                    <form onsubmit="handleCustomerLogin(event)" id="customer-login-form">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-uppercase">Email, Mobile, or Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person text-primary"></i></span>
                                <input type="text" name="email" id="login-email" class="form-control" placeholder="customer@jhaztaxi.com or mobile" required autofocus>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="form-label small fw-bold text-uppercase mb-0">Password</label>
                                <a href="javascript:void(0)" onclick="showToast('Password reset requested. Check your email.', 'info')" class="small text-muted text-decoration-none">Forgot?</a>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock text-warning"></i></span>
                                <input type="password" name="password" id="login-password" class="form-control" placeholder="Enter your password" required>
                            </div>
                        </div>

                        <button type="submit" id="btn-customer-signin" class="btn btn-yellow w-100 py-2 fw-bold fs-6 mb-3 shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Ride
                        </button>
                    </form>

                    <div class="text-center pt-3 border-top small">
                        <span class="text-muted">Don't have an account?</span>
                        <a href="/register.html" class="fw-bold text-dark text-decoration-underline ms-1">
                            Sign Up as Passenger &rarr;
                        </a>
                    </div>

                    <!-- Driver Portal Switch -->
                    <div class="text-center mt-3 pt-3 border-top small bg-light p-2 rounded-3">
                        <span class="text-muted">Are you a Driver Partner?</span>
                        <a href="/driver/login.html" class="fw-bold text-warning text-dark text-decoration-none ms-1">
                            <i class="bi bi-car-front-fill me-1"></i> Driver Portal &rarr;
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="py-3 text-center text-muted small mt-auto border-top">
        <div class="container">
            &copy; 2026 JhazTaxi &bull; Passenger Transportation Network
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
