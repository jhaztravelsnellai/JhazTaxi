<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration - Sign Up for JhazTaxi Cabs</title>
    <meta name="description" content="Sign up for a JhazTaxi passenger account. Transparent upfront fares, instant cab booking, and professional verified drivers.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://jhaztaxi.com/register.html">
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
    <meta name="theme-color" content="#FFC107">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark navbar-jhaz">
        <div class="container">
            <a class="navbar-brand navbar-brand-jhaz" href="/index.html">
                <span class="brand-badge">JH</span>
                <span>JhazTaxi</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="/login.html" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Customer Login
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <span class="brand-badge fs-2 mb-2 d-inline-block">JH</span>
                        <h1 class="h3 fw-bold mb-1">Create Passenger Account</h1>
                        <p class="text-muted small">Join JhazTaxi for transparent, comfortable, and safe rides</p>
                    </div>

                    <form onsubmit="handleCustomerRegister(event)">
                        <!-- Full Name (Required) -->
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-uppercase">Full Name * (Required)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                <input type="text" name="full_name" class="form-control" placeholder="e.g. Rahul Sharma" required autofocus>
                            </div>
                        </div>

                        <!-- Mobile Number & Email (Both Required) -->
                        <div class="row g-2 mb-3">
                            <div class="col-sm-6">
                                <label class="form-label small fw-bold text-uppercase text-danger">
                                    <i class="bi bi-telephone-fill me-1"></i> Mobile Number * (Required)
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-telephone text-primary"></i></span>
                                    <input type="tel" name="phone" class="form-control" placeholder="+91 98765 43210" required>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label small fw-bold text-uppercase">Email Address * (Required)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                    <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                                </div>
                            </div>
                        </div>

                        <!-- Password & Confirm Password -->
                        <div class="row g-2 mb-4">
                            <div class="col-sm-6">
                                <label class="form-label small fw-bold text-uppercase">Password * (Min. 6 chars)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                    <input type="password" name="password" class="form-control" placeholder="Min. 6 chars" minlength="6" required>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label small fw-bold text-uppercase">Confirm Password *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-shield-check"></i></span>
                                    <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" minlength="6" required>
                                </div>
                            </div>
                        </div>

                        <div class="form-check mb-4 small text-muted">
                            <input class="form-check-input" type="checkbox" id="termsCheck" required checked>
                            <label class="form-check-label" for="termsCheck">
                                I agree to the <a href="javascript:void(0)" class="text-dark fw-bold">Terms of Service</a> and <a href="javascript:void(0)" class="text-dark fw-bold">Privacy Policy</a> of JhazTaxi.
                            </label>
                        </div>

                        <button type="submit" id="btn-customer-register" class="btn btn-yellow w-100 py-2 fw-bold fs-6 mb-3 shadow-sm">
                            <i class="bi bi-check-circle-fill me-1"></i> Create Customer Account
                        </button>
                    </form>

                    <div class="text-center pt-3 border-top small">
                        <span class="text-muted">Already have a customer account?</span>
                        <a href="/login.html" class="fw-bold text-dark text-decoration-underline ms-1">Sign In &rarr;</a>
                    </div>

                    <!-- Driver Portal Switch -->
                    <div class="text-center mt-3 pt-3 border-top small bg-light p-2 rounded-3">
                        <span class="text-muted">Own a car and want to earn?</span>
                        <a href="/driver/register.html" class="fw-bold text-warning text-dark text-decoration-none ms-1">
                            <i class="bi bi-car-front-fill me-1"></i> Register as Driver Partner &rarr;
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="py-3 text-center text-muted small mt-auto border-top">
        <div class="container">
            &copy; 2026 JhazTaxi &bull; Passenger Transportation Network
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
